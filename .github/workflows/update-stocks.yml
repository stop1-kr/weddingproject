name: 주가 자료 갱신 (3차시)

on:
  workflow_dispatch:
    inputs:
      asof:
        description: "시가총액 순위 기준일 (YYYYMMDD)"
        required: true
        default: "20260930"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 주가 자료 만들기
        run: python tools/build_stocks.py --asof "${{ github.event.inputs.asof }}"
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      - name: 결과 저장(commit)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/stocks.json js/stocks-data.js
          git commit -m "주가 자료 갱신" || echo "변경 없음"
          git push

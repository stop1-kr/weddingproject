name: 주가 자료 갱신 (3~4차시)

on:
  workflow_dispatch:
    inputs:
      asof:
        description: "기준일 (YYYYMMDD)"
        required: true
        default: "20260930"
      kind:
        description: "만들 자료"
        type: choice
        default: "주식 (TOP10 + extra_companies.txt)"
        options:
          - "주식 (TOP10 + extra_companies.txt)"
          - "주식 (코스피·코스닥 전체)"
          - "ETF (etf_list.txt, 4차시)"
          - "미국 주식·환율 (us_list.txt, 4차시)"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests yfinance
      - name: 자료 만들기
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          case "${{ inputs.kind }}" in
            미국*)  python tools/build_us.py --asof "${{ inputs.asof }}" ;;
            *전체*) python tools/build_stocks.py --asof "${{ inputs.asof }}" --all ;;
            ETF*)   python tools/build_stocks.py --asof "${{ inputs.asof }}" --etf ;;
            *)      python tools/build_stocks.py --asof "${{ inputs.asof }}" ;;
          esac
      - name: 결과 저장(commit)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A data js
          git commit -m "자료 갱신: ${{ inputs.kind }}" || echo "변경 없음"
          git push
